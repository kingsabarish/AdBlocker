# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build features.
org.gradle.caching=true
# Configuration cache temporarily disabled: AGP 9.3's ProcessNavigationXmlTask
# fails to serialize its runtime-dependencies field into the config cache.
org.gradle.configuration-cache=false

# AndroidX (required for modern Jetpack libraries).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resources needed for the modules that use them.
android.nonTransitiveRClass=true
